name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions: { contents: read }
jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: pw, POSTGRES_DB: trail }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check app tests
      - run: uv run pytest -q            # unit, API contract, tenant isolation, eval regression (SQLite + migrations)
      - name: Migration check on PostgreSQL (upgrade → downgrade → upgrade)
        env: { DATABASE_URL: "postgresql://postgres:pw@localhost:5432/trail" }
        run: uv run alembic upgrade head && uv run alembic downgrade base && uv run alembic upgrade head
      - run: uvx pip-audit --strict
        continue-on-error: true   # advisory until a baseline is triaged
      - run: PYTHONPATH=. uv run python evals/run_eval.py
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env: { API_URL: "http://localhost:8000" }
      - run: npm audit --omit=dev --audit-level=high
  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: cd apps/api && uv sync --frozen
      - run: cd apps/web && npm ci && npx playwright install --with-deps chromium && npx playwright test
# Deployment: Vercel and Railway use their native GitHub integrations (deploy on push to main, previews on PRs).
# No deploy job here, to avoid conflicting with provider integrations. See docs/deployment/.
